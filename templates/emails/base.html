<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ClaimIQ Notification{% endblock %}</title>
    <style>
        body { font-family: 'Inter', Arial, sans-serif; background-color: #0B0E14; margin: 0; padding: 0; color: #E0E0E0; }
        .container { max-width: 600px; margin: 20px auto; background-color: #121820; border-radius: 16px; overflow: hidden; border: 1px solid rgba(101, 96, 79, 0.1); }
        .header { background-color: #0B0E14; padding: 40px; text-align: center; border-bottom: 1px solid rgba(101, 96, 79, 0.1); }
        .logo { font-size: 28px; font-weight: 900; color: #00DCE5; letter-spacing: 2px; text-decoration: none; }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; background: rgba(101, 96, 79, 0.1); color: #00DCE5; }
        .content { padding: 40px; }
        h1 { font-size: 24px; color: #FFFFFF; margin-bottom: 16px; }
        p { line-height: 1.6; font-size: 16px; color: #949494; margin-bottom: 30px; }
        .footer { background-color: #0B0E14; padding: 30px; text-align: center; font-size: 12px; color: #4B4B4B; }
        .btn { display: inline-block; background: linear-gradient(135deg, #00DCE5 0%, #00959B 100%); color: #0B0E14 !important; padding: 16px 32px; border-radius: 12px; text-decoration: none; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; font-size: 14px; box-shadow: 0 4px 20px rgba(101, 96, 79, 0.3); }
        .alert { background: rgba(220, 38, 38, 0.1); color: #ef4444; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(220, 38, 38, 0.2); }
        .success { background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="{{ site_url|default:'#' }}" class="logo">CLAIMIQ</a>
        </div>
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
        <div class="footer">
            &copy; {% now "Y" %} CLAIMIQ AI CORE. ALL RIGHTS RESERVED.<br>
            This is an automated notification. Please do not reply.
        </div>
    </div>
</body>
</html>
