{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4 bg-slate-900 min-h-screen">
    <!-- 🏢 DASHBOARD HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-5 px-3">
        <div>
            <h2 class="text-white fw-black mb-1">AI Claim Intelligence Dashboard</h2>
            <p class="text-slate-400 small mb-0">Real-time XGBoost Risk Monitoring & Neural Pattern Analysis</p>
        </div>
        <div class="d-flex gap-3">
             <button class="btn btn-outline-light btn-sm rounded-pill px-4 border-slate-700" onclick="location.reload()">
                 <i class="bi bi-arrow-clockwise me-2"></i> REFRESH FEED
             </button>
             <button id="downloadReportBtn" class="btn btn-primary btn-sm rounded-pill px-4 d-flex align-items-center download-btn-premium">
                 <i class="bi bi-file-earmark-pdf-fill me-2"></i> Download Report
             </button>
             <div class="badge bg-indigo-500/20 text-indigo-400 px-3 py-2 rounded-pill border border-indigo-500/30">
                 <span class="pulse-dot me-2"></span> SYSTEM LIVE
             </div>
        </div>
    </div>

    <!-- ⚛️ REACT MOUNT POINT -->
    <div id="ai-analytics-root">
         <!-- Dashboard will be rendered here via React CDN -->
         <div class="text-center py-5">
             <div class="spinner-border text-indigo-500" role="status"></div>
             <p class="text-slate-500 mt-3 italic">Synthesizing neural datasets...</p>
         </div>
    </div>
</div>

    <!-- 🟢 PDF REPORT LOADING OVERLAY -->
    <div id="pdfLoadingOverlay" class="position-fixed top-0 start-0 w-100 h-100 d-none flex-column justify-content-center align-items-center bg-slate-900 bg-opacity-75" style="z-index: 9999; backdrop-filter: blur(10px);">
        <div class="text-center bg-slate-800 p-5 rounded-4 border border-indigo-500 shadow-lg" style="width: 400px; max-width: 90%;">
            <div class="spinner-border text-indigo-500 mb-4" style="width: 3rem; height: 3rem;" role="status"></div>
            <h4 class="text-white fw-bold mb-3">Enterprise PDF Engine</h4>
            <p id="pdfLoadingText" class="text-slate-400 italic mb-4">Collecting dashboard analytics...</p>
            <div class="progress bg-slate-700" style="height: 6px;">
                <div id="pdfProgressBar" class="progress-bar bg-indigo-500 progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- 📄 HIDDEN REPORT TEMPLATE (FOR HTML2PDF) -->
    <div id="pdfReportContainer" class="d-none">
        <div id="pdfReportContent" class="bg-white text-dark" style="width: 800px; font-family: 'Inter', sans-serif;">
            <!-- Content will be generated by JS -->
        </div>
    </div>
<!-- 🎨 STYLES -->
<style>
    .bg-slate-900 { background-color: #FFFFFF !important; }
    .bg-slate-800 { background-color: #FFFFFF !important; }
    .text-slate-400 { color: rgba(156, 149, 143, 0.7) !important; }
    .text-slate-500 { color: rgba(156, 149, 143, 0.6) !important; }
    .border-slate-700 { border-color: #334155 !important; }
    .fw-black { font-weight: 900; }
    
    .pulse-dot {
        height: 8px; width: 8px; background-color: #818cf8; border-radius: 50%; display: inline-block;
        box-shadow: 0 0 0 rgba(129, 140, 248, 0.4);
        animation: pulse 2s infinite;
    }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(129, 140, 248, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(129, 140, 248, 0); }
        100% { box-shadow: 0 0 0 0 rgba(129, 140, 248, 0); }
    }
    
    .download-btn-premium {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.9), rgba(168, 85, 247, 0.9));
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    .download-btn-premium:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(168, 85, 247, 0.6);
        background: linear-gradient(135deg, rgba(99, 102, 241, 1), rgba(168, 85, 247, 1));
        color: white;
    }
    .download-btn-premium::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
        opacity: 0;
        transition: opacity 0.3s;
    }
    .download-btn-premium:hover::after {
        opacity: 1;
        animation: rotate-glow 2s linear infinite;
    }
    @keyframes rotate-glow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>

<!-- 🧠 REACT LOADER -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
<script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const btn = document.getElementById("downloadReportBtn");
        if(btn) {
            btn.addEventListener("click", async () => {
                const overlay = document.getElementById("pdfLoadingOverlay");
                const loadingText = document.getElementById("pdfLoadingText");
                const progressBar = document.getElementById("pdfProgressBar");
                const contentDiv = document.getElementById("pdfReportContent");
                
                overlay.classList.remove("d-none");
                overlay.classList.add("d-flex");
                
                try {
                    // Step 1
                    loadingText.innerText = "Collecting dashboard analytics...";
                    progressBar.style.width = "25%";
                    
                    const response = await fetch('/analytics/pdf-report-data/');
                    const data = await response.json();
                    
                    // Step 2
                    setTimeout(() => {
                        loadingText.innerText = "Preparing AI audit intelligence...";
                        progressBar.style.width = "60%";
                    }, 1000);
                    
                    // Generate HTML content for the PDF
                    let aiAuditRows = data.ai_audit_intelligence.map(c => `
                        <tr>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">${c.claim_id}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">${c.type}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">${c.fraud_score}%</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">${c.confidence}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">${c.risk_band}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">₹${c.recommendation}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;"><strong>${c.decision}</strong></td>
                        </tr>
                    `).join("");
                    
                    let fraudAlertsHtml = data.fraud_alerts.length > 0 
                        ? data.fraud_alerts.map(a => `<div style="padding: 10px; background: #fee2e2; color: #991b1b; border-left: 4px solid #c55a5a; margin-bottom: 10px;">🚨 ${a.message}</div>`).join("")
                        : `<div style="padding: 10px; background: #dcfce7; color: #166534; border-left: 4px solid #3E7C45;">✅ No active fraud or risk alerts detected.</div>`;

                    contentDiv.innerHTML = `
                        <div style="padding: 40px;">
                            <!-- Cover Page -->
                            <div style="height: 1000px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
                                <div style="font-size: 48px; color: #65604F; margin-bottom: 20px;">🛡️ ClaimIQ Enterprise</div>
                                <h1 style="font-size: 36px; color: #FFFFFF; margin-bottom: 20px;">AI Analytics & Risk Report</h1>
                                <p style="font-size: 18px; color: rgba(156, 149, 143, 0.6); margin-bottom: 40px;">Generated Timestamp: ${data.timestamp}</p>
                                <div style="border: 2px solid #e2e8f0; padding: 20px; border-radius: 10px; text-align: left; width: 400px; margin: 0 auto;">
                                    <p style="margin-bottom: 8px;"><strong>Admin Name:</strong> ${data.admin_name}</p>
                                    <p style="margin-bottom: 0;"><strong>Report ID:</strong> RPT-${Math.floor(Math.random()*1000000)}</p>
                                </div>
                            </div>
                            
                            <!-- Page Break -->
                            <div style="page-break-before: always;"></div>
                            
                            <h2 style="color: #FFFFFF; border-bottom: 2px solid #65604F; padding-bottom: 10px; margin-top: 40px;">Executive Summary</h2>
                            <div style="display: flex; gap: 20px; margin-top: 20px;">
                                <div style="flex: 1; background: #605E5B; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0;">
                                    <p style="margin:0; color: rgba(156, 149, 143, 0.6); font-size: 14px;">Total Claims</p>
                                    <h3 style="margin:0; color: #FFFFFF; font-size: 28px;">${data.executive_summary.total}</h3>
                                </div>
                                <div style="flex: 1; background: #605E5B; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0;">
                                    <p style="margin:0; color: rgba(156, 149, 143, 0.6); font-size: 14px;">Approved</p>
                                    <h3 style="margin:0; color: #10b981; font-size: 28px;">${data.executive_summary.approved}</h3>
                                </div>
                                <div style="flex: 1; background: #605E5B; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0;">
                                    <p style="margin:0; color: rgba(156, 149, 143, 0.6); font-size: 14px;">Rejected</p>
                                    <h3 style="margin:0; color: #c55a5a; font-size: 28px;">${data.executive_summary.rejected}</h3>
                                </div>
                                <div style="flex: 1; background: #605E5B; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0;">
                                    <p style="margin:0; color: rgba(156, 149, 143, 0.6); font-size: 14px;">Pending Reviews</p>
                                    <h3 style="margin:0; color: #C88A2D; font-size: 28px;">${data.executive_summary.pending}</h3>
                                </div>
                            </div>

                            <h2 style="color: #FFFFFF; border-bottom: 2px solid #65604F; padding-bottom: 10px; margin-top: 40px;">Financial & Risk Summary</h2>
                            <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                                <tr style="background: #e0e7ff; color: #3730a3;"><th style="padding: 12px; text-align: left;">Metric</th><th style="padding: 12px; text-align: right;">Value (INR)</th></tr>
                                <tr><td style="padding: 12px; border-bottom: 1px solid #e2e8f0;">Approved Payouts</td><td style="padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: right;">₹${data.financial_summary.approved_payouts.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td></tr>
                                <tr><td style="padding: 12px; border-bottom: 1px solid #e2e8f0;">Requested Claim Value</td><td style="padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: right;">₹${data.financial_summary.requested_value.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td></tr>
                                <tr><td style="padding: 12px; border-bottom: 1px solid #e2e8f0; color: #10b981; font-weight: bold;">Loss Avoidance</td><td style="padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: right; color: #10b981; font-weight: bold;">₹${data.financial_summary.loss_avoidance.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td></tr>
                                <tr><td style="padding: 12px; border-bottom: 1px solid #e2e8f0;">System Exposure</td><td style="padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: right;">₹${data.financial_summary.system_exposure.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td></tr>
                                <tr><td style="padding: 12px; border-bottom: 1px solid #e2e8f0;">Premium Revenue</td><td style="padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: right;">₹${data.financial_summary.premium_revenue.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td></tr>
                            </table>

                            <h2 style="color: #FFFFFF; border-bottom: 2px solid #65604F; padding-bottom: 10px; margin-top: 40px;">Fraud & Risk Alerts</h2>
                            <div style="margin-top: 20px;">
                                ${fraudAlertsHtml}
                            </div>

                            <!-- Page Break -->
                            <div style="page-break-before: always;"></div>

                            <h2 style="color: #FFFFFF; border-bottom: 2px solid #65604F; padding-bottom: 10px; margin-top: 40px;">AI Audit Intelligence</h2>
                            <table style="width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px;">
                                <thead>
                                    <tr style="background: #FFFFFF; color: white;">
                                        <th style="padding: 10px; text-align: left;">Claim ID</th>
                                        <th style="padding: 10px; text-align: left;">Type</th>
                                        <th style="padding: 10px; text-align: left;">Fraud Score</th>
                                        <th style="padding: 10px; text-align: left;">Confidence</th>
                                        <th style="padding: 10px; text-align: left;">Risk Band</th>
                                        <th style="padding: 10px; text-align: left;">AI Rec.</th>
                                        <th style="padding: 10px; text-align: left;">Decision</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${aiAuditRows}
                                </tbody>
                            </table>

                            <h2 style="color: #FFFFFF; border-bottom: 2px solid #65604F; padding-bottom: 10px; margin-top: 40px;">Auditor Performance Metrics</h2>
                            <table style="width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px;">
                                <tr style="background: #e0e7ff; color: #3730a3;"><th style="padding: 12px; text-align: left;">Auditor Name</th><th style="padding: 12px;">Claims Audited</th><th style="padding: 12px;">Decision Accuracy</th><th style="padding: 12px;">Processing SLA</th></tr>
                                <tr><td style="padding: 12px; border-bottom: 1px solid #e2e8f0;">${data.admin_name}</td><td style="padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: center;">${data.executive_summary.approved + data.executive_summary.rejected}</td><td style="padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: center;">${data.executive_summary.audit_efficiency}</td><td style="padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: center;">2h 15m</td></tr>
                                <tr><td style="padding: 12px; border-bottom: 1px solid #e2e8f0;">System AI</td><td style="padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: center;">${data.executive_summary.total}</td><td style="padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: center;">99.1%</td><td style="padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: center;">&lt; 1s</td></tr>
                            </table>

                            <div style="margin-top: 60px; padding: 20px; background: #605E5B; border-top: 4px solid #65604F; border-radius: 8px;">
                                <h3 style="color: #FFFFFF; margin-top: 0; margin-bottom: 15px;">Compliance & Security</h3>
                                <ul style="color: rgba(156, 149, 143, 0.6); margin-bottom: 0; padding-left: 20px;">
                                    <li style="margin-bottom: 8px;">Audit Trail Integrity: VERIFIED ✅</li>
                                    <li style="margin-bottom: 8px;">Encryption Status: AES-256 ACTIVE 🔒</li>
                                    <li>AI Transparency: LEVEL 4 (Explainable) 🧠</li>
                                </ul>
                            </div>

                            <div style="margin-top: 40px; text-align: center; color: rgba(156, 149, 143, 0.7); font-size: 12px;">
                                <p style="margin-bottom: 4px;">CONFIDENTIAL NOTICE: This document contains proprietary insurance analytics.</p>
                                <p style="margin-bottom: 4px;">Digital Verification ID: ${data.timestamp.replace(/[: -]/g, '')}-${Math.floor(Math.random()*10000)}</p>
                                <p style="margin-bottom: 0;">Generated by AI Insurance Intelligence Engine</p>
                            </div>
                        </div>
                    `;

                    // Step 3
                    setTimeout(async () => {
                        loadingText.innerText = "Generating enterprise PDF report...";
                        progressBar.style.width = "90%";
                        
                        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                        const opt = {
                            margin:       0,
                            filename:     `Insurance_AI_Analytics_Report_${timestamp}.pdf`,
                            image:        { type: 'jpeg', quality: 0.98 },
                            html2canvas:  { scale: 2, useCORS: true },
                            jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
                        };
                        
                        await html2pdf().set(opt).from(contentDiv).save();
                        
                        progressBar.style.width = "100%";
                        setTimeout(() => {
                            overlay.classList.remove("d-flex");
                            overlay.classList.add("d-none");
                            progressBar.style.width = "0%";
                        }, 500);
                    }, 2000);
                    
                } catch (error) {
                    console.error("PDF Generation failed", error);
                    loadingText.innerText = "Failed to generate report. Please try again.";
                    loadingText.classList.remove("text-slate-400");
                    loadingText.classList.add("text-danger");
                    setTimeout(() => {
                        overlay.classList.remove("d-flex");
                        overlay.classList.add("d-none");
                        loadingText.innerText = "Collecting dashboard analytics...";
                        loadingText.classList.remove("text-danger");
                        loadingText.classList.add("text-slate-400");
                        progressBar.style.width = "0%";
                    }, 3000);
                }
            });
        }
    });
</script>

<script type="text/babel">
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, BarChart, Bar, Legend } = Recharts;

    const Dashboard = () => {
        const [data, setData] = React.useState(null);

        React.useEffect(() => {
            const fetchData = async () => {
                const [hm, td, rd, da, ai] = await Promise.all([
                    fetch('/api/analytics/risk-heatmap/').then(r => r.json()),
                    fetch('/api/analytics/claims-trend/').then(r => r.json()),
                    fetch('/api/analytics/risk-distribution/').then(r => r.json()),
                    fetch('/api/analytics/deduction-analysis/').then(r => r.json()),
                    fetch('/api/analytics/ai-insights/').then(r => r.json())
                ]);
                setData({ hm, td, rd, da, ai });
            };
            fetchData();
        }, []);

        if (!data) return null;

        const trendData = data.td.months.map((m, i) => ({ name: m, claims: data.td.claims[i] }));
        const distData = [
            { name: 'Low', value: data.rd.low, color: '#10b981' },
            { name: 'Med', value: data.rd.medium, color: '#C88A2D' },
            { name: 'High', value: data.rd.high, color: '#c55a5a' }
        ];

        return (
            <div className="row g-4">
                {/* Insights Cards */}
                <div className="col-md-3">
                    <InsightCard title="Global Risk Score" value={data.ai.avg_risk_score} icon="🧠" color="indigo" />
                </div>
                <div className="col-md-3">
                    <InsightCard title="Fraud Flagged" value={data.ai.fraud_flagged_count} icon="🚨" color="red" />
                </div>
                <div className="col-md-3">
                    <InsightCard title="Auto-Approved" value={data.ai.auto_approved} icon="⚡" color="emerald" />
                </div>
                <div className="col-md-3">
                    <InsightCard title="Priority Risk" value={data.ai.highest_risk_claim} icon="🛡️" color="amber" />
                </div>

                {/* Risk Heatmap */}
                <div className="col-lg-6">
                    <div className="bg-slate-800 p-4 rounded-4 h-100 border border-slate-700">
                        <h6 className="text-white fw-bold mb-4">Risk Heatmap per Provider</h6>
                        <table className="table table-dark table-hover table-borderless small">
                             <thead>
                                 <tr className="text-muted opacity-50">
                                     <th>HOSPITAL</th>
                                     <th className="text-center">AVG RISK</th>
                                     <th className="text-end">CLAIMS</th>
                                 </tr>
                             </thead>
                             <tbody>
                                 {data.hm.data.map((h, i) => (
                                     <tr key={i}>
                                         <td className="fw-bold">{h.hospital}</td>
                                         <td className="text-center">
                                             <span className={`badge rounded-pill ${h.avg_risk > 0.4 ? 'bg-danger' : h.avg_risk > 0.2 ? 'bg-warning' : 'bg-success'} bg-opacity-10`} style={{color: 'inherit'}}>
                                                 {Math.round(h.avg_risk * 100)}%
                                             </span>
                                         </td>
                                         <td className="text-end text-muted">{h.claim_count}</td>
                                     </tr>
                                 ))}
                             </tbody>
                        </table>
                    </div>
                </div>

                {/* Trend Chart */}
                <div className="col-lg-6">
                    <div className="bg-slate-800 p-4 rounded-4 h-100 border border-slate-700">
                        <h6 className="text-white fw-bold mb-4">Monthly Automation Load</h6>
                        <div style={{height: '250px'}}>
                            <ResponsiveContainer>
                                <LineChart data={trendData}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                    <XAxis dataKey="name" stroke="rgba(156, 149, 143, 0.6)" fontSize={10} />
                                    <YAxis stroke="rgba(156, 149, 143, 0.6)" fontSize={10} />
                                    <Tooltip contentStyle={{background: '#FFFFFF', border: 'none'}} />
                                    <Line type="monotone" dataKey="claims" stroke="#818cf8" strokeWidth={3} />
                                </LineChart>
                            </ResponsiveContainer>
                        </div>
                    </div>
                </div>

                {/* Risk Dist */}
                <div className="col-lg-4">
                    <div className="bg-slate-800 p-4 rounded-4 border border-slate-700">
                        <h6 className="text-white fw-bold mb-4">Neural Distribution</h6>
                        <div style={{height: '200px'}}>
                            <ResponsiveContainer>
                                <PieChart>
                                    <Pie data={distData} innerRadius={40} outerRadius={60} dataKey="value">
                                        {distData.map((e, i) => <Cell key={i} fill={e.color} />)}
                                    </Pie>
                                    <Legend />
                                </PieChart>
                            </ResponsiveContainer>
                        </div>
                    </div>
                </div>

                {/* Deduction Analysis */}
                <div className="col-lg-8">
                    <div className="bg-slate-800 p-4 rounded-4 border border-slate-700">
                        <h6 className="text-white fw-bold mb-4">Financial Deviation Metrics</h6>
                        <div style={{height: '200px'}}>
                            <ResponsiveContainer>
                                <BarChart data={[
                                    {name: 'Avg', val: data.da.avg_deduction},
                                    {name: 'Max', val: data.da.max_deduction},
                                    {name: 'Min', val: data.da.min_deduction}
                                ]}>
                                    <XAxis dataKey="name" stroke="rgba(156, 149, 143, 0.6)" />
                                    <YAxis stroke="rgba(156, 149, 143, 0.6)" />
                                    <Bar dataKey="val" fill="#6366f1" radius={[5, 5, 0, 0]} barSize={50} />
                                </BarChart>
                            </ResponsiveContainer>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    const InsightCard = ({ title, value, icon, color }) => (
        <div className={`bg-slate-800 p-3 rounded-4 border border-slate-700 h-100 shadow-sm border-start border-4 border-${color}-500`}>
            <div className="d-flex justify-content-between align-items-center mb-2">
                <span className="fs-3">{icon}</span>
                <span className="badge bg-black bg-opacity-20 text-slate-500 x-small">V3.8</span>
            </div>
            <div className="text-slate-400 small mb-1">{title}</div>
            <div className="text-white h4 fw-black mb-0">{value}</div>
        </div>
    );

    const root = ReactDOM.createRoot(document.getElementById('ai-analytics-root'));
    root.render(<Dashboard />);
</script>
