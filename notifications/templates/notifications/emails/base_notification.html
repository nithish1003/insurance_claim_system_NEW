{% extends "emails/base.html" %}

{% block title %}{{ title }} - ClaimIQ Notification{% endblock %}

{% block content %}
    <div class="badge">{{ type }} Alert</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    {% if cta_url %}
        <a href="{{ cta_url }}" class="btn">View Details</a>
    {% endif %}
{% endblock %}
