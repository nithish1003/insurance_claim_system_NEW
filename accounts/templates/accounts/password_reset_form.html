{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — AI Tracking System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #F4EEE2;
            --card-dark: rgba(2, 73, 80, 0.8);
            --accent-cyan: #65604F;
            --primary-blue: #65604F;
            --text-main: #ffffff;
            --text-muted: rgba(156, 149, 143, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #FFFFFF 0%, #F4EEE2 100%);
            color: white;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow: hidden;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--card-dark);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 50px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(101, 96, 79, 0.05);
            border: 1px solid rgba(101, 96, 79, 0.2);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            color: var(--accent-cyan);
            font-size: 36px;
            box-shadow: 0 0 30px rgba(101, 96, 79, 0.1);
        }

        h2 {
            font-weight: 800;
            font-size: 32px;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 35px;
            font-size: 15px;
            line-height: 1.6;
        }

        .form-label {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
            text-align: left;
        }

        .form-control {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 25px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 15px;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.06);
            border-color: var(--accent-cyan);
            color: white;
            outline: none;
            box-shadow: 0 0 25px rgba(101, 96, 79, 0.2);
        }

        .btn-reset {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary-blue), #65604F);
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(101, 96, 79, 0.3);
        }

        .btn-reset:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(101, 96, 79, 0.5);
            filter: brightness(1.1);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .back-link:hover {
            color: var(--accent-cyan);
            transform: translateX(-5px);
        }

        .errorlist {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            color: #ff4d4d;
            font-size: 13px;
            text-align: left;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="icon-box">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h2>Forgot Password?</h2>
        <p>No worries! Enter your registered email and we'll send you instructions to reset your password.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div>
                <label class="form-label" for="id_email">Email Address</label>
                {{ form.email }}
                {% if form.email.errors %}
                    <div class="errorlist">{{ form.email.errors }}</div>
                {% endif %}
            </div>
            <button type="submit" class="btn-reset">
                Send Reset Link <i class="bi bi-send-fill"></i>
            </button>
        </form>
        
        <a href="{% url 'accounts:login' %}" class="back-link">
            <i class="bi bi-arrow-left"></i> Back to Login
        </a>
    </div>

    <script>
        // Apply bootstrap classes to django generated input
        document.addEventListener('DOMContentLoaded', function() {
            var emailInput = document.getElementById('id_email');
            if (emailInput) {
                emailInput.classList.add('form-control');
                emailInput.setAttribute('placeholder', 'e.g. name@company.com');
            }
        });
    </script>
</body>
</html>
