{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — AI Tracking System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #F4EEE2;
            --card-dark: rgba(2, 73, 80, 0.85);
            --accent-cyan: #65604F;
            --primary-blue: #65604F;
            --text-main: #ffffff;
            --text-muted: rgba(156, 149, 143, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #FFFFFF 0%, #F4EEE2 100%);
            color: white;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow: hidden;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--card-dark);
            backdrop-filter: blur(25px);
            border-radius: 32px;
            padding: 50px 45px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .reset-icon {
            width: 80px;
            height: 80px;
            background: rgba(101, 96, 79, 0.1);
            color: var(--accent-cyan);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 30px;
            border: 1px solid rgba(101, 96, 79, 0.2);
            box-shadow: 0 10px 30px rgba(101, 96, 79, 0.15);
        }

        h2 {
            font-weight: 800;
            font-size: 34px;
            margin-bottom: 15px;
            letter-spacing: -1px;
            color: white;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 15px;
            line-height: 1.6;
        }

        .form-label {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 10px;
            display: block;
            text-align: left;
        }

        .form-control {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 14px;
            padding: 16px 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 15px;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.06);
            border-color: var(--accent-cyan);
            color: white;
            outline: none;
            box-shadow: 0 0 25px rgba(101, 96, 79, 0.25);
        }

        .btn-reset {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary-blue), #65604F);
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 12px 30px rgba(101, 96, 79, 0.3);
        }

        .btn-reset:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(101, 96, 79, 0.5);
            filter: brightness(1.1);
        }

        .auth-footer {
            margin-top: 35px;
            font-size: 14px;
        }

        .auth-footer a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .auth-footer a:hover {
            color: var(--accent-cyan);
            transform: translateX(-5px);
        }

        /* Ambient Decoration */
        .glow-sphere {
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(101, 96, 79, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="glow-sphere" style="top: -100px; right: -100px;"></div>
    <div class="glow-sphere" style="bottom: -100px; left: -100px;"></div>

    <div class="auth-wrapper">
        <div class="reset-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>

        <h2>Forgot Password?</h2>
        <p class="subtitle">Enter the email address associated with your account and we'll send you a secure link to reset your password.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4 text-start">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="Enter your registered email">
            </div>

            <button type="submit" class="btn-reset">
                Send Reset Link <i class="bi bi-send-fill"></i>
            </button>
        </form>

        <div class="auth-footer">
            <a href="{% url 'accounts:login' %}">
                <i class="bi bi-arrow-left"></i> Back to Sign In
            </a>
        </div>
    </div>
</body>
</html>
